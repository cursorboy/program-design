name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # The corpus e2e is the false-ABSENT release gate (PLAN.md CEO review).
  corpus-gate:
    name: corpus-gate (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest — includes the corpus false-ABSENT gate)
        run: npx vitest run

  # Publish to npm on a version tag (vX.Y.Z), gated on the corpus suite.
  # Requires the NPM_TOKEN repo secret (npm automation token).
  release:
    name: release
    needs: corpus-gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish (skips if this version is already on the registry)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "program-design@$VERSION" version >/dev/null 2>&1; then
            echo "program-design@$VERSION is already published — nothing to do."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
